[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openchibirig"
version = "0.0.0"
description = "Open-source automatic rigging toolkit for front-facing chibi character illustrations."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OpenChibiRig contributors" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
openchibirig = "openchibirig.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openchibirig"]

[tool.hatch.build]
include = [
  "src/openchibirig/**/*.py",
  "src/openchibirig/resources/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
